name: Grok skill check
on:
  push:
    paths: ["grok/**"]
  pull_request:
    paths: ["grok/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python grok/check_skills.py
